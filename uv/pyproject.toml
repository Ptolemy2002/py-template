[project]
name = "{{ tmplr.project_name }}"
version = "0.1.0"
description = "{{ tmplr.project_description }}"
readme = "README.md"
requires-python = ">={{ tmplr.python_version }}"
dependencies = [
    "argparse>=1.4.0",
    "colorama>=0.4.6",
    "pytest>=9.0.3"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]